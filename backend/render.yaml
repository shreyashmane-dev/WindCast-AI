services:
  - type: web
    name: windcast-ai-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: MODEL_PATH
        value: trained_models
      - key: FIREBASE_CREDENTIALS_PATH
        value: secret/firebase-service-account.json
      - key: JWT_SECRET_KEY
        value: cyber-secret-jwt-key-windcast-ai-2026-dynamic-strobe
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
