services:
  windcast-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env.example
    ports:
      - "8000:8000"
    volumes:
      - ./backend/trained_models:/app/backend/trained_models
      - ./data:/app/data:ro
    environment:
      - PYTHONPATH=/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
